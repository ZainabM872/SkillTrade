workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build
  - docker

# Cache downloaded npm packages, not node_modules.
.node-job:
  image: node:22
  cache:
    key:
      files:
        - webui/package-lock.json
    paths:
      - webui/.npm/

react-tests:
  extends: .node-job
  stage: test
  script:
    - cd webui
    - npm ci --cache .npm --prefer-offline
    - CI=true npm test -- --watchAll=false --runInBand

database-tests:
  stage: test
  image: postgres:18
  services:
    - name: postgres:18
      alias: postgres
  variables:
    POSTGRES_DB: skilltrade_test
    POSTGRES_USER: postgres
    # This database is isolated to the CI job and is not exposed outside its network.
    POSTGRES_PASSWORD: ci_test_password
  script:
    - |
      attempt=0
      until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 30 ]; then
          echo "PostgreSQL did not become ready in time."
          exit 1
        fi
        sleep 1
      done
    - psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f database/schema.sql
    - psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f database/seed.sql
    - psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f database/verify.sql

react-build:
  extends: .node-job
  stage: build
  script:
    - cd webui
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - webui/build/
    expire_in: 1 week

# Compose config validation does not start containers or require a Docker daemon.
# The referenced secret is an empty temporary file used only for config parsing.
docker-compose-config:
  stage: docker
  image: docker:27-cli
  script:
    - |
      if [ ! -e secrets/db_password.txt ]; then
        mkdir -p secrets
        : > secrets/db_password.txt
        trap 'rm -f secrets/db_password.txt; rmdir secrets 2>/dev/null || true' EXIT
      fi
      docker compose -f compose.yaml config --quiet
      docker compose -f compose.prod.yaml --profile production config --quiet
      docker compose -f compose.database.yaml config --quiet
