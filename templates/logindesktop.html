<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillTrade Login</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='sharedUI.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='loginandsignup.css') }}"
    />
  </head>

  <body class="bodytext">
    <header class="headerdivider">
      <h1 href="#" class="logoSkill">skill</h1>
      <h1 href="#" class="logoTrade">Trade</h1>
    </header>
    <div>
      <p class="nextchapter">YOUR NEXT CHAPTER</p>
      <p class="leftintro1">
        Come curious. <br />Leave with<br /><span style="color: #5b5bef"
          >something new.</span
        >
      </p>
      <p class="leftintro2">
        Your skills, your people, your next “I can do that.”
      </p>
      <p class="replay">↻ Replay introduction</p>
    </div>
    <div class="logincard">
      <p class="welcometext">Welcome to SkillTrade</p>
      <p class="keeplearningtext">Log in to keep learning.</p>
      <p class="emailtext">Email address</p>
      <p class="emailbox"></p>
      <!-- <p class="emailfield">name@example.com</p> -->
      <p class="passtext">Password</p>
      <p class="passbox"></p>
      <!-- <p class="passfield">••••••••••••</p> -->
      <p class="resetpass">Forgot password?</p>
      <button class="signupsection">
        <p class="loginbutton">Login</p>
      </button>
      <p class="signuptext">New to SkillTrade?</p>
      <p class="createaccount">Create an account</p>
    </div>
  </body>
</html>
