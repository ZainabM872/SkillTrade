name: Sync from UCalgary GitLab

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull from GitLab and push to GitHub
        run: |
          git config user.name "ZainabM872"
          git config user.email "ZainabM872@users.noreply.github.com"
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@csgit.ucalgary.ca/seng513f26/pg-9/seng513-202604-pg-9.git
          git fetch gitlab --tags
          git checkout -B main gitlab/main
          git checkout origin/main -- .github
          git commit -m "Keep GitHub Actions sync workflow" --allow-empty
          git push origin main --force --tags
