services:
  dev:
    profiles: [development]
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: ./webui/src
          target: /app/src
        - action: sync
          path: ./webui/public
          target: /app/public
        - action: rebuild
          path: ./webui/package.json
        - action: rebuild
          path: ./webui/package-lock.json

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      # The name must be the mounted name used in "secrets" and not the actual file
      POSTGRES_PASSWORD_FILE: /run/secrets/skilltrade_db_pass
      POSTGRES_DB: skilltrade_db
    ports:
      - "3307:3306"
    secrets:
      - skilltrade_db_pass
    volumes:
      - skilltrade-db-volume:/var/lib/postresql/data
      - ./database:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.3
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      # MYSQL_ROOT_PASSWORD: /run/secrets/skilltrade_db_pass
    ports:
      - "8080:80"
    depends_on:
      - db

secrets:
  skilltrade_db_pass:
    file: ./secrets/db_password.txt

volumes:
  skilltrade-db-volume:
