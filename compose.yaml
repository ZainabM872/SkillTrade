
services:
  dev:
    profiles: [development]
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: ./webui/src
          target: /app/src
        - action: sync
          path: ./webui/public
          target: /app/public
        - action: rebuild
          path: ./webui/package.json
        - action: rebuild
          path: ./webui/package-lock.json

  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: mydb
    ports:
      - "3307:3306"
    volumes:
      - my-db-volume:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: my-secret-pw
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  my-db-volume:
