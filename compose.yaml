services:
  dev:
    profiles: [development]
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: ./webui/src
          target: /app/src
        - action: sync
          path: ./webui/public
          target: /app/public
        - action: rebuild
          path: ./webui/package.json
        - action: rebuild
          path: ./webui/package-lock.json

  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: /run/secrets/db_password
      MYSQL_DATABASE: skilltrade
    ports:
      - "3307:3306"
    secrets:
      - skilltrade_db_pass
    volumes:
      - skilltrade-db-volume:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: /run/secrets/db_password
    ports:
      - "8080:80"
    depends_on:
      - db

secrets:
  skilltrade_db_pass:
    file: ./secrets/db_password.txt

volumes:
  skilltrade-db-volume:
