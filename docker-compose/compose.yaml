services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ../webui:/app
      - webui_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      stdin_open: true
      tty: true
      command: npm start
  prod:
    build:
      context: ..
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  dev:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./package.json
          target: /app/package.json

volumes:
  webui_node_modules:
